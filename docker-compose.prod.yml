version: '3.8'

services:
  reclaimdao-mongodb:
    image: mongo:7.0
    container_name: reclaimdao-mongodb
    restart: always
    environment:
      MONGO_INITDB_DATABASE: reclaimdao
    volumes:
      - reclaimdao_mongo_prod_data:/data/db
    networks:
      - reclaimdao-net

  reclaimdao-backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: reclaimdao-backend
    restart: always
    ports:
      - "127.0.0.1:8001:8000"
    environment:
      PORT: 8000
      MONGODB_URI: mongodb://reclaimdao-mongodb:27017/reclaimdao
      NODE_ENV: production
      JWT_SECRET: reclaimdao_prod_jwt_secret_9988_2026
      ADMIN_USERNAME: ADMIN
      ADMIN_EMAIL: admin@reclaimdao.org
      ADMIN_PASSWORD: ADMIN123
      CLIENT_URL: https://reclaimdao.org
      SMTP_HOST: smtp.hostinger.com
      SMTP_PORT: 465
      SMTP_SECURE: "true"
      SMTP_USER: support@reclaimdao.org
      SMTP_PASSWORD: hb6d-mhat-2hdd-vmq2
      EMAIL_SUPPORT: support@reclaimdao.org
      INFO_SMTP_HOST: smtp.hostinger.com
      INFO_SMTP_PORT: 465
      INFO_SMTP_SECURE: "true"
      INFO_SMTP_USER: info@reclaimdao.org
      INFO_SMTP_PASSWORD: oknz-mqyf-n8ka-dbms
      EMAIL_INFO: info@reclaimdao.org
      EMAIL_HOST: smtp.hostinger.com
      EMAIL_PORT: 465
      EMAIL_SECURE: "true"
      EMAIL_USERNAME: support@reclaimdao.org
      EMAIL_PASSWORD: hb6d-mhat-2hdd-vmq2
      EMAIL_FROM: support@reclaimdao.org
    volumes:
      - reclaimdao_uploads:/app/uploads
      - reclaimdao_data:/app/data
    depends_on:
      - reclaimdao-mongodb
    networks:
      - reclaimdao-net

  reclaimdao-frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: reclaimdao-frontend
    restart: always
    ports:
      - "127.0.0.1:3081:80"
    depends_on:
      - reclaimdao-backend
    networks:
      - reclaimdao-net

networks:
  reclaimdao-net:
    name: reclaimdao-net
    driver: bridge

volumes:
  reclaimdao_mongo_prod_data:
    name: reclaimdao_mongo_prod_data
  reclaimdao_uploads:
    name: reclaimdao_uploads
  reclaimdao_data:
    name: reclaimdao_data
