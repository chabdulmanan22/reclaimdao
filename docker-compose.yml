services:
  reclaimdao-mongodb:
    image: mongo:6.0
    container_name: reclaimdao-mongodb
    restart: always
    environment:
      MONGO_INITDB_DATABASE: reclaimdao-db
    volumes:
      - reclaimdao_mongo_data:/data/db
    networks:
      - reclaimdao-net

  reclaimdao-backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: reclaimdao-backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      PORT: 8000
      MONGODB_URI: mongodb://reclaimdao-mongodb:27017/reclaimdao-db
      NODE_ENV: production
      JWT_SECRET: ReclaimDAOProductionSecretKey2026!
      ADMIN_USERNAME: admin
      ADMIN_EMAIL: support@reclaimdao.org
      ADMIN_PASSWORD: AdminPassword123!
      EMAIL_HOST: smtp.hostinger.com
      EMAIL_PORT: 465
      EMAIL_SECURE: "true"
      EMAIL_USERNAME: support@reclaimdao.org
      EMAIL_PASSWORD: ggRR54$$4E
      EMAIL_FROM: support@reclaimdao.org
      CLIENT_URL: https://reclaimdao.org
    depends_on:
      - reclaimdao-mongodb
    networks:
      - reclaimdao-net

  reclaimdao-frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: reclaimdao-frontend
    restart: always
    ports:
      - "3080:80"
    depends_on:
      - reclaimdao-backend
    networks:
      - reclaimdao-net

networks:
  reclaimdao-net:
    driver: bridge

volumes:
  reclaimdao_mongo_data:
